[package]
name = "bc-license-checker"
version = "0.2.0"
edition = "2021"

[lib]
name = "bclicensechecker"
path = "src/lib.rs"

[[bin]]
name = "bc-license-checker"
path = "src/main.rs"

[dependencies]
calamine = "0.19.1"
clap = { version = "4.0.29", features = ["derive"] }
encoding_rs = "0.8.31"
encoding_rs_io = "0.1.7"
itertools = "0.14.0"
